name: tymer

publish_to: 'none'
version: 2.0.4+7
environment:
  sdk: ">=3.2.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  routemaster: ^1.0.1
  cupertino_icons: ^1.0.6
  flutter_lints: ^3.0.1

  # Local Packages
  tymer_api:
    path: packages/tymer_api
  key_value_storage:
    path: packages/key_value_storage
  user_repository:
    path: packages/user_repository

  function_and_extension_library:
    path: packages/function_and_extension_library





  tab_container:
    path: packages/features/tab_container

  home:
    path: packages/features/home


  # Authentication
  sign_in:
    path: packages/features/sign_in
  verify_otp:
    path: packages/features/verify_otp
  reset_password:
    path: packages/features/reset_password
  send_otp:
    path: packages/features/send_otp


  # Domain Models and Component Library
  domain_models:
    path: packages/domain_models
  component_library:
    path: packages/component_library
  firebase_core: ^3.3.0


dependency_overrides:
  wakelock:
    git:
      url: https://github.com/chandrabezzo/wakelock.git # repository
      ref: main # branch
      path: wakelock/ # folder


flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal/Tajawal-Black.ttf
        - asset: fonts/Tajawal/Tajawal-Bold.ttf
        - asset: fonts/Tajawal/Tajawal-ExtraBold.ttf
        - asset: fonts/Tajawal/Tajawal-ExtraLight.ttf
        - asset: fonts/Tajawal/Tajawal-Light.ttf
        - asset: fonts/Tajawal/Tajawal-Medium.ttf
        - asset: fonts/Tajawal/Tajawal-Regular.ttf
    - family: Gotham
      fonts:
        - asset: fonts/Gotham/GothamBold.ttf
        - asset: fonts/Gotham/GothamBook.ttf
        - asset: fonts/Gotham/GothamLight.ttf
        - asset: fonts/Gotham/GothamMedium.ttf
        - asset: fonts/Gotham/GothamMedium_1.ttf

  assets:
    - assets/
    - assets/icons/